[package]
name = "host-list-maker"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = true }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
